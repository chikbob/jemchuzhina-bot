<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Жемчужина — запись без ожидания</title><desc id="desc">Telegram-бот и веб-кабинет для академии красоты. Расписание, клиенты и команда в одном проекте.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e38"/><stop offset="1" stop-color="#1c5157"/></linearGradient></defs>
<rect width="1280" height="420" rx="24" fill="url(#bg)"/>
<circle cx="1160" cy="90" r="235" fill="#76b5ac" opacity=".08"/><circle cx="1090" cy="360" r="170" fill="#76b5ac" opacity=".06"/>
<g font-family="Arial, sans-serif"><text x="64" y="73" font-size="13" letter-spacing="3" fill="#a1c7bf">АВТОМАТИЗАЦИЯ ДЛЯ АКАДЕМИИ КРАСОТЫ</text>
<text x="60" y="158" font-size="68" font-weight="700" fill="#fffaf0">Жемчужина</text>
<text x="64" y="214" font-size="28" fill="#d5e5df">Запись без ожидания.</text>
<text x="64" y="253" font-size="23" fill="#a1c7bf">Расписание, клиенты и команда — рядом.</text>
<rect x="64" y="310" width="148" height="42" rx="21" fill="#e8c889"/><text x="138" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#163c43">Telegram-бот</text>
<rect x="224" y="310" width="150" height="42" rx="21" fill="#ffffff" opacity=".09"/><text x="299" y="337" text-anchor="middle" font-size="15" fill="#d5e5df">Веб-кабинет</text>
<rect x="784" y="66" width="430" height="288" rx="20" fill="#f5f8f3"/>
<circle cx="811" cy="94" r="4" fill="#397e81"/><text x="826" y="99" font-size="13" font-weight="700" fill="#24464a">КЛИЕНТ → АКАДЕМИЯ</text><path d="M808 117h382" stroke="#dce5df"/>
<rect x="808" y="141" width="52" height="52" rx="14" fill="#dcece7"/><path d="m823 166 9 9 15-19" fill="none" stroke="#397e81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="878" y="159" font-size="20" font-weight="700" fill="#183b42">Вы записаны!</text><text x="878" y="185" font-size="15" fill="#677f7b">Время выбрано. Место закреплено.</text>
<rect x="808" y="222" width="382" height="1" fill="#dce5df"/>
<text x="808" y="258" font-size="14" fill="#677f7b">КАЛЕНДАРЬ</text><text x="1008" y="258" font-size="14" fill="#677f7b">СТАТУС</text>
<text x="808" y="292" font-size="19" font-weight="700" fill="#183b42">Свободные окна</text><rect x="1008" y="272" width="161" height="31" rx="15" fill="#dcece7"/><text x="1088" y="293" text-anchor="middle" font-size="13" fill="#286b64">Подтверждена</text>
</g></svg>