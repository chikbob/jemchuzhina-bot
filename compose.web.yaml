services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/pearl.sqlite3
      PORT: 8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - pearl-data:/app/data
    stop_grace_period: 30s
volumes:
  pearl-data:
