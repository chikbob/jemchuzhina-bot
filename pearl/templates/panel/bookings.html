{% extends 'panel/base.html' %}{% from 'panel/macros.html' import booking_table,pagination with context %}
{% block content %}<div class="heading"><div><p class="eyebrow">КЛИЕНТСКАЯ БАЗА</p><h1>Записи клиентов</h1><p class="muted">Контакты, пожелания и история визитов.</p></div><a class="button secondary" href="{{ export_url('bookings') }}">Скачать CSV ↓</a></div><section class="card"><form class="filters" method="get"><label class="wide">Поиск<input name="q" value="{{ request.args.get('q','') }}" placeholder="Имя, телефон, номер или дата" maxlength="100"></label><label>Раздел<select name="scope">{% for key,label in scopes.items() %}<option value="{{ key }}" {{ 'selected' if request.args.get('scope','upcoming')==key else '' }}>{{ label }}</option>{% endfor %}</select></label><label>Статус<select name="status"><option value="">Любой статус</option>{% for key,label in status_names.items() %}<option value="{{ key }}" {{ 'selected' if request.args.get('status')==key else '' }}>{{ label }}</option>{% endfor %}</select></label><label>Сортировка<select name="sort">{% for key,label in sorts.items() %}<option value="{{ key }}" {{ 'selected' if request.args.get('sort','date_asc')==key else '' }}>{{ label }}</option>{% endfor %}</select></label><button class="button">Найти</button></form>{{ booking_table(rows) }}{{ pagination(page,pages,total,page_url) }}</section>{% endblock %}
